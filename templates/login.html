<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Вход</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    body {
      background-color: #0a0a0a; color: #ffffff; font-family: -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;
    }
    .panel {
      max-width: 600px !important; width: 100%; padding: 48px !important;
      background: #141414; border-radius: 20px;
    }
    h2 { text-align: center; font-size: 32px; margin-bottom: 32px; }
    
    label { 
      display: block; font-size: 15px; color: #a5b4c9; font-weight: 500;
      transition: color 0.3s ease;
    }
    label:focus-within { color: #ffffff; }
    
    .input-wrapper { position: relative; width: 100%; margin-top: 8px; }
    .form-input {
      width: 100%; box-sizing: border-box; padding: 14px 36px 14px 16px;
      background: #1c1c1c; border: 1px solid #333; border-radius: 10px; font-size: 16px; color: #fff;
    }
    .form-input:focus { border-color: #ff3b30; background: #222; outline: none; }
    
    .form-input.error { border-color: #ff3b30; }
    .error-message { color: #ff3b30; font-size: 13px; margin-top: 4px; display: none; }
    
    .clear-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: transparent !important; border: none !important; font-size: 22px !important;
      color: #666 !important; cursor: pointer; display: none; z-index: 10;
    }
    
    .toggle-password-btn {
      background: none; border: none; color: #888; font-size: 13px; 
      cursor: pointer; padding: 0; margin-top: 8px; display: inline-block;
    }
    
    .auth-row { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 20px; }
    .auth-divider { color: #666; font-weight: bold; padding-bottom: 16px; }
    
    .cta { font-size: 18px; padding: 16px; border-radius: 10px; background: #ff3b30; border: none; color: white; width: 100%; cursor: pointer; }
  </style>
</head>
<body>
  <main class="panel">
    <h2>Вход</h2>
    {% if error %}<p style="color:#ff3b30; text-align: center;">{{ error }}</p>{% endif %}
    
    <form method="post" novalidate onsubmit="return validateForm(event)">
      <div class="auth-row">
        <label style="flex: 1;">Телефон
          <div class="input-wrapper">
            <input name="phone" type="tel" id="phone-input" class="form-input" oninput="toggleClear(this); hideError(this)">
            <button type="button" class="clear-btn" onclick="clearInput(this)">×</button>
            <div class="error-message">Укажите телефон или email</div>
          </div>
        </label>
        
        <div class="auth-divider">или</div>
        
        <label style="flex: 1;">Email
          <div class="input-wrapper">
            <input type="email" name="email" class="form-input" value="{{ email if email else '' }}" oninput="toggleClear(this); hideError(this)">
            <button type="button" class="clear-btn" onclick="clearInput(this)">×</button>
            <div class="error-message">Укажите телефон или email</div>
          </div>
        </label>
      </div>

      <label style="margin-bottom: 24px;">Пароль
        <div class="input-wrapper">
          <input name="password" type="password" id="password-input" class="form-input" oninput="toggleClear(this); hideError(this)">
          <button type="button" class="clear-btn" onclick="clearInput(this)">×</button>
          <div class="error-message">Введите пароль</div>
        </div>
        <button type="button" class="toggle-password-btn" onclick="togglePassword()">Показать пароль</button>
      </label>
      
      <button type="submit" class="cta">Войти</button>
    </form>
    
    <p style="margin-top:24px; text-align: center; color: #888;">
      Нет аккаунта? <a href="/register" style="color:#ff3b30;">Зарегистрироваться</a>
    </p>
  </main>

  <script>
    function toggleClear(input) { input.nextElementSibling.style.display = input.value.length > 0 ? 'block' : 'none'; }
    function clearInput(btn) { const input = btn.previousElementSibling; input.value = ''; btn.style.display = 'none'; hideError(input); }
    
    function hideError(input) {
      input.classList.remove('error');
      const errorMsg = input.parentElement.querySelector('.error-message');
      if(errorMsg) errorMsg.style.display = 'none';
    }

    function togglePassword() {
      const passInput = document.getElementById('password-input');
      const btn = document.querySelector('.toggle-password-btn');
      if (passInput.type === 'password') {
        passInput.type = 'text'; btn.textContent = 'Скрыть пароль';
      } else {
        passInput.type = 'password'; btn.textContent = 'Показать пароль';
      }
    }

    function validateForm(event) {
      let isValid = true;
      const form = event.target;
      const phone = form.querySelector('input[name="phone"]');
      const email = form.querySelector('input[name="email"]');
      const password = form.querySelector('input[name="password"]');

      if (!phone.value && !email.value) {
        [phone, email].forEach(input => {
          input.classList.add('error');
          input.parentElement.querySelector('.error-message').style.display = 'block';
        });
        isValid = false;
      }

      if (!password.value) {
        password.classList.add('error');
        password.parentElement.querySelector('.error-message').style.display = 'block';
        isValid = false;
      }

      if (!isValid) event.preventDefault();
      return isValid;
    }

    document.getElementById('phone-input').addEventListener('input', function (e) {
      let x = e.target.value.replace(/\D/g, '').match(/(\d{0,1})(\d{0,3})(\d{0,3})(\d{0,2})(\d{0,2})/);
      if (!x[1]) { e.target.value = ''; toggleClear(e.target); return; }
      if (x[1] !== '7' && x[1] !== '8') x[1] = '7';
      e.target.value = '+7' + (x[2] ? ' (' + x[2] : '') + (x[3] ? ') ' + x[3] : '') + (x[4] ? '-' + x[4] : '') + (x[5] ? '-' + x[5] : '');
      toggleClear(e.target);
    });
  </script>
</body>
</html>
