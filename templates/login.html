<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Вход</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <main class="panel" style="max-width:420px;margin:40px auto;">
    <h2>Вход</h2>
    {% if error %}
      <p style="color:#b00020">{{ error }}</p>
    {% endif %}
    <form method="post">
      <label>Email<br><input type="email" name="email" value="{{ email if email else '' }}" required></label><br><br>
      <label>Пароль<br><input name="password" type="password" required /></label><br><br>
      <button type="submit" class="cta">Войти</button>
    </form>
    <p style="margin-top:12px">Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
  </main>
</body>
</html>
