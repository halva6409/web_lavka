<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Добавить товар</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;

            background: #0f0f0f;
            color: white;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 0;
        }

        .panel {
            background: #181818;
            border: 1px solid #292929;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .form {
            display: grid;
            gap: 15px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px 14px;

            background: #101010;
            color: white;

            border: 1px solid #333;
            border-radius: 8px;

            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #666;
        }

        button,
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 10px 16px;

            border: none;
            border-radius: 8px;

            background: #ff3b30;
            color: white;

            font-weight: 700;
            text-decoration: none;

            cursor: pointer;
        }

        button:hover,
        .button:hover {
            filter: brightness(1.1);
        }


        /* =========================================================
           КНОПКИ АДМИН-ПАНЕЛИ
           ========================================================= */

        .change-btns {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 12px;

            margin: 20px 0;

            width: 100%;
        }


        .change {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 100%;
            min-width: 0;
            height: 40px;

            padding: 7px 20px;
            margin: 0;

            border: 1px solid #333;
            border-radius: 13px;

            background: #263967;
            color: #ffffff;

            cursor: pointer;

            font-family:
                "Fira Sans Extra Condensed",
                sans-serif;

            font-size: 17px;
            font-weight: 500;

            letter-spacing: 0.02em;

            box-sizing: border-box;

            text-decoration: none;

            transition:
                transform 0.2s ease,
                filter 0.2s ease,
                box-shadow 0.2s ease;
        }


        .change:hover {
            filter: brightness(1.12);

            transform: translateY(-1px);
        }


        .change:active {
            transform: scale(0.98);
        }


        /* =========================================================
           АДАПТИВ
           ========================================================= */

        @media (max-width: 700px) {

            body {
                padding: 18px;
            }

            .panel {
                padding: 18px;
            }

            .change-btns {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (max-width: 400px) {

            .change-btns {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <h1>Админ-панель</h1>


    <!-- =========================================================
         КНОПКИ
         ========================================================= -->

    <div class="change-btns">

        <a
                href="{{ url_for('admin_add') }}"
                class="change"
            >
                Добавить товар
            </a>
            <a
                href="{{ url_for('admin_news') }}"
                class="change"
            >
                Добавить новость
            </a>

            
            
            <a
            href="{{ url_for('admin_chats') }}"
            class="change"
            >
            Чаты
            </a>
            
            
            <a
            href="{{ url_for('admin_bd') }}"
            class="change"
            >
            База данных
            </a>
            <a
                href="{{ url_for('admin_products') }}"
                class="change"
            >
                Товары
            </a>
            <a
                href="{{ url_for('admin_news_view') }}"
                class="change"
            >
                Новости
            </a>

    </div>


    <!-- =========================================================
         ДОБАВЛЕНИЕ ТОВАРА
         ========================================================= -->

    <section class="panel">

        <h2>Добавить товар</h2>


        <form
            class="form"
            method="POST"
            action="{{ url_for('admin_add') }}"
            enctype="multipart/form-data"
        >


            <input
                type="text"
                name="title"
                placeholder="Название товара"
                required
            >


            <textarea
                name="description"
                placeholder="Описание товара"
            ></textarea>


            <input
                type="text"
                name="colors"
                placeholder="Цвет"
            >


            <input
                type="number"
                name="price"
                placeholder="Цена"
                step="0.01"
                required
            >


            <input
                type="text"
                name="category"
                placeholder="Категория"
            >


            <input
                type="number"
                name="kolvo"
                placeholder="Количество"
                min="0"
            >


            <label>
                Фотография товара:
            </label>


            <input
                type="file"
                name="images"
                accept="image/*"
                multiple
            >


            <button type="submit">
                Добавить товар
            </button>


        </form>

    </section>


</div>

</body>

</html>
