<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Регистрация</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <main class="panel" style="max-width:420px;margin:40px auto;">
    <h2>Регистрация</h2>
    {% if error %}
      <p style="color:#b00020">{{ error }}</p>
    {% endif %}
    <form method="post">
      <label>Имя<br><input name="name" /></label><br><br>
      <label>Email<br><input name="email" type="email" required /></label><br><br>
      <label>Пароль<br><input name="password" type="password" required /></label><br><br>
      <button type="submit" class="cta">Зарегистрироваться</button>
    </form>
    <p style="margin-top:12px">Уже есть аккаунт? <a href="/login">Войти</a></p>
  </main>
</body>
</html>
