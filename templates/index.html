<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лавка у Дома</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  </head>
  <body>
    <div class="grain"></div>

    <header class="hero">
      <nav class="topbar">
        <div class="brand">Лавка у Дома</div>
        <a class="cta" href="#catalog">Смотреть каталог</a>
      </nav>

      <div class="hero-content">
        <p class="kicker">Свежие товары каждый день</p>
        <h1>Онлайн-витрина для магазина с автоматическим обновлением</h1>
        <p class="subtitle">
          Товары добавляются через Telegram-бота и сразу появляются на сайте.
        </p>
      </div>
    </header>

    <main>
      <section class="panel" id="catalog">
        <div class="panel-head">
          <h2>Каталог</h2>
          <button id="refreshBtn" class="refresh-btn">Обновить</button>
        </div>
        <div id="productsGrid" class="products-grid"></div>
      </section>
    </main>

    <template id="productCardTemplate">
      <article class="card">
        <img class="card-image" src="" alt="" loading="lazy" />
        <div class="card-body">
          <p class="chip"></p>
          <h3 class="card-title"></h3>
          <p class="card-text"></p>
          <div class="card-row">
            <strong class="price"></strong>
            <span class="stock"></span>
          </div>
        </div>
      </article>
    </template>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
