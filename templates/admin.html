<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Админ-доступ</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0f0f0f;
            color: white;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;
        }


        .admin-container {
            width: min(1100px, calc(100% - 40px));

            text-align: center;
        }


        .admin-title {
            margin: 0 0 30px;

            font-size: 40px;
            font-weight: 800;

            letter-spacing: 0.02em;
        }


        .admin-buttons {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 12px;

            width: 100%;
        }


        .admin-button {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 100%;
            height: 50px;

            padding: 10px 18px;

            border: 1px solid #333;
            border-radius: 13px;

            background: #263967;
            color: white;

            text-decoration: none;

            font-family:
                "Fira Sans Extra Condensed",
                sans-serif;

            font-size: 17px;
            font-weight: 500;

            letter-spacing: 0.02em;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                filter 0.2s ease,
                box-shadow 0.2s ease;
        }


        .admin-button:hover {
            filter: brightness(1.15);

            transform: translateY(-2px);

            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.25);
        }


        .admin-button:active {
            transform: scale(0.98);
        }


        @media (max-width: 700px) {

            .admin-buttons {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media (max-width: 400px) {

            .admin-buttons {
                grid-template-columns: 1fr;
            }

            .admin-title {
                font-size: 27px;
            }

        }

    </style>

</head>


<body>

    <main class="admin-container">

        <h1 class="admin-title">
            Админ-доступ
        </h1>


        <div class="admin-buttons">

            <a
                href="{{ url_for('admin_add') }}"
                class="admin-button"
            >
                Добавить товар
            </a>


            <a
                href="{{ url_for('admin_products') }}"
                class="admin-button"
            >
                Товары
            </a>


            <a
                href="{{ url_for('admin_chats') }}"
                class="admin-button"
            >
                Чаты
            </a>


            <a
                href="{{ url_for('admin_bd') }}"
                class="admin-button"
            >
                База данных
            </a>

        </div>

    </main>

</body>

</html>
